# ARPG Equipments Mod - Made by Iguera
#
# I had to use an already existing group inside Athena files, because it does not let me create new ones. That's why the name is so random
# But I managed to ignore this restriction and manipulate the results through some functions, workarounds and subgroups
# For now the rates are the same, which means you have the same chance to get each item, but I plan to change it
# Subgroup 2 is designated for Commom Chest (Tier 1)
# Subgroup 3 is designated for Uncommom Chest (Tier 2)
# Subgroup 4 is designated for Magic Chest (Tier 3)
# Subgroup 5 is designated for Rare Chest (Tier 4)
# Subgroup 6 is designated for Unique Chest (Tier 5)
# Subgroup 7 is designated for Legendary Chest (Tier 6)

